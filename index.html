<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universidade</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

</head>

<body>

    <header class="cabecalho-main">

        <nav class="cabecalho-main__nav">

            <div class="cabecalho-main__logo">

                <p class="cabecalho-main__logo__textlogo">
                    <i class="fas fa-graduation-cap"></i>
                    Universidade
                </p>

            </div> <!--fim-cabecalho-main__logo-->

            <div class="cabecalho-main__links">

                <nav class="links_nav">
                    <ul>
                        <li> <a href="#" class="activate">Inicio</a></li>
                        <li> <a href="#">Cursos</a></li>
                        <li> <a href="#">Eventos</a></li>
                        <li> <a href="#">Contato</a></li>
                    </ul>

                </nav>

            </div> <!--fim cabecalho-main__links-->


            <div class="cabecalho-main__botao">

                <button class="btn_login">Login</button>

            </div><!--fim cabecalho-main__botao-->

        </nav> <!--cabecalho-main__nav-->


        <div class="header-content">

            <div class="header-content__text">

                <h1 class="header-content__title">Bem Vindo á Universidade</h1>

                <p>Explore nossos cursos e eventos.</p>

                <button class="btn_saiba_mais">Saiba Mais</button>

            </div><!--fim header-content__text-->



            <div class="header-content__img">
                <img src="iconePessoa.png" alt="universitaria">
            </div> <!--fim header-content__img-->


        </div><!--fim header-content-->

    </header> <!--fim cabecalho main-->


    <main class="main">

        <section class="main__funcionalidades">

            <div class="main__box">

                <h5 class="main__subtitle">
                    <img src="pilha-de-livros.png" alt="pilha de livros">

                    Nossos cursos

                </h5>

                <p>Veja os cursos disponiveis</p>



                <button class="main__btn btn_orange">Ver Cursos</button>



            </div>


            <div class="main__box">

                <h5 class="main__subtitle">
                    <img src="calendario.png" alt="calendario">

                    Proximos Eventos

                </h5>

                <p>Confira os próximos eventos</p>



                <button class="main__btn btn_orange"> Ver Eventos</button>

            </div>



            <div class="main__box">

                <h5 class="main__subtitle">
                    <img src="chapeu-de-formatura.png" alt="chapeu de formatura">

                    Área do Aluno

                </h5>

                <p>Acesse seu portal estudantil</p>



                <button class="main__btn btn_azul">Entrar</button>

            </div>

        </section> <!--fim main__funcionalidades-->

        <footer>
            <p>@ Universidade 2026</p>
        </footer>


    </main> <!--fim main-->

</body>

</html>
